<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配置">
<meta name="theme-color" content="#1a5fb4">
<title>配置中心</title>
<style>
:root{--blue:#1a5fb4;--bg:#f5f6f7;--line:#e3e8ef;--ok:#0a7a2f;--warn:#c0392b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;font-size:15px;}
.wrap{max-width:520px;margin:0 auto;padding:16px 12px 100px;}
.card{background:#fff;border-radius:10px;padding:16px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
h1{font-size:20px;margin:0 0 4px;color:#111;}
.sub{font-size:12px;color:#999;margin-bottom:14px;}
.sec{font-size:14px;font-weight:600;color:var(--blue);border-left:3px solid var(--blue);padding-left:8px;margin:0 0 12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:500;}
.field label .req{color:var(--warn);margin-left:2px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 12px;font-size:14px;background:#fafbfc;color:#222;font-family:inherit;}
.field input:focus,.field select:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,95,180,.08);}
.field input.err{border-color:var(--warn);background:#fffafa;}
.field .tip{font-size:11px;color:#9aa5b1;margin-top:5px;line-height:1.6;}
.pwbox{position:relative;}
.pwbox input{padding-right:60px;}
.pwbox .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#8a94a3;font-size:12px;padding:8px 10px;cursor:pointer;}
.status{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:14px;}
.status.ok{background:#eaf7ee;color:var(--ok);border:1px solid #bfe3ca;}
.status.no{background:#fff8e6;color:#8a6100;border:1px solid #f0dfae;}
.status.err{background:#fff0f0;color:var(--warn);border:1px solid #f3c6c6;}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}
.actions{display:flex;gap:10px;margin-top:6px;}
.actions button{flex:1;border:0;border-radius:10px;padding:14px 8px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.actions button:active{opacity:.8;}
.actions button:disabled{opacity:.5;}
.btn-pri{background:var(--blue);color:#fff;}
.btn-sec{background:#eef2f7;color:#333;}
.btn-test{background:#eef2f7;color:var(--blue);}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:14px 24px;border-radius:11px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:82%;text-align:center;line-height:1.7;white-space:pre-wrap;}
.toast.on{opacity:1;}
.backbtn{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-size:16px;text-decoration:none;margin-bottom:14px;font-weight:600;background:#eef4fb;border:1px solid #d5e4f7;border-radius:22px;padding:8px 18px 8px 13px;transition:all .15s;width:fit-content;}
.backbtn svg{width:17px;height:17px;flex-shrink:0;}
.backbtn:active{background:#dfeaf8;transform:scale(.97);}
.chips{display:flex;flex-wrap:wrap;gap:12px;}
.chip{position:relative;background:#eef2f7;border:1px solid #dfe5ee;border-radius:9px;padding:13px 32px 13px 15px;font-size:14px;font-weight:600;color:#333;user-select:none;-webkit-user-select:none;}
.chip .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:#fff;border:0;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);padding:0;}
.chip .x:active{background:#a53125;}
.chip-add{background:#fff;border:1.5px dashed #b9c3d0;color:#8a94a3;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:600;cursor:pointer;line-height:1;}
.chip-add:active{background:#f2f5f9;}
.chip-input{border:1px solid var(--blue);border-radius:9px;padding:12px 12px;font-size:14px;width:120px;background:#fff;font-family:inherit;box-shadow:0 0 0 3px rgba(26,95,180,.08);}
.chip-input:focus{outline:0;}
.crew-count{font-size:12px;color:#9aa5b1;margin-top:10px;}
.crew-empty{color:#9aa5b1;font-size:13px;text-align:center;padding:14px 0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backbtn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>返回日志</a>
  <h1>配置中心</h1>
  <div class="sub">识别接口与人员名单等基础设置，填一次保存即可，日志页自动读取</div>

  <div class="card">
    <div class="sec">识别接口</div>

    <div class="field">
      <label>服务商</label>
      <select id="provider">
        <option value="free">硅基流动·免费OCR（DeepSeek-OCR，免费）</option>
        <option value="silicon">硅基流动 SiliconFlow（推荐 · 手机直连可用）</option>
        <option value="zhipu">智谱 GLM-4V-Flash（免费但手机可能连不上）</option>
        <option value="custom">自定义接口</option>
      </select>
      <div class="tip" id="providerTip">推荐硅基流动：官方接口支持浏览器直连，手机上稳定可用</div>
    </div>

    <div class="field">
      <label>接口地址 <span class="req">*</span></label>
      <input id="base" placeholder="https://..." autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label>模型名称 <span class="req">*</span></label>
      <input id="model" placeholder="glm-4v-flash" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label>API Key <span class="req">*</span></label>
      <div class="pwbox">
        <input id="key" type="password" placeholder="粘贴你的 Key" autocomplete="off" spellcheck="false">
        <button class="eye" id="eye" type="button">显示</button>
      </div>
      <div class="tip">Key 只保存在这台手机浏览器里，不会上传到任何服务器</div>
    </div>

    <div class="status no" id="status">
      <span class="dot"></span><span id="statusText">未配置</span>
    </div>

    <div class="actions">
      <button class="btn-test" id="btnTest">测试连通</button>
      <button class="btn-pri" id="btnSave">保存</button>
    </div>
  </div>

  <div class="card">
    <div class="sec">人员配置</div>
    <div id="crewChips" class="chips"></div>
    <div class="crew-count">当前共 <b id="crewCount">0</b> 人 · 点 <b style="color:#8a94a3">＋</b> 新增，点人名右上角 <b style="color:#c0392b">×</b> 删除 · 日志页「当班人员」同步更新</div>
  </div>

  <div class="card">
    <div class="sec">炉号配置</div>
    <div id="furnaceChips" class="chips"></div>
    <div class="crew-count">当前共 <b id="furnaceCount">0</b> 个炉号 · 点 <b style="color:#8a94a3">＋</b> 新增，点右上角 <b style="color:#c0392b">×</b> 删除 · 日志页按炉号正序排列</div>
  </div>

  <div class="card">
    <div class="sec">当前保存的内容</div>
    <div id="saved" style="font-size:13px;color:#666;line-height:1.9;">读取中…</div>
    <div class="actions" style="margin-top:14px">
      <button class="btn-sec" id="btnClear">清除配置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 存储层（与日志页共用同一份） ===================== */
const CFG_KEY = 'dr_cfg_v1';
const PROVIDERS = {
  free:    { name:'硅基流动·免费OCR(DeepSeek-OCR)', base:'https://api.siliconflow.cn/v1/chat/completions', model:'deepseek-ai/DeepSeek-OCR',
             tip:'免费！DeepSeek 文档解析模型，输出表格自动提取比表；需完成实名认证才可调用' },
  zhipu:   { name:'智谱 GLM-4V-Flash', base:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4v-flash',
             tip:'推荐硅基流动：官方接口支持浏览器直连，手机上稳定可用' },
  silicon: { name:'硅基流动 SiliconFlow', base:'https://api.siliconflow.cn/v1/chat/completions', model:'Qwen/Qwen3-VL-32B-Instruct',
             tip:'推荐！官方支持浏览器直连；Qwen3-VL 系列识别准，每天识别几张表约不到1分钱；想要更便宜可在模型名里改用 Qwen/Qwen3-VL-8B-Instruct' },
  custom:  { name:'自定义接口', base:'', model:'', tip:'填兼容 OpenAI 格式的视觉模型接口地址' }
};

const $ = s => document.querySelector(s);
let memFallback = {};
const LS_OK = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();

function getCfg(){
  if(!LS_OK) return Object.assign({}, memFallback);
  try{
    const raw = localStorage.getItem(CFG_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function setCfg(obj){
  memFallback = Object.assign({}, obj);
  if(!LS_OK){ toast('当前浏览器禁止本地存储，配置无法保存\n请用 Chrome/Safari 浏览器打开'); return false; }
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(obj)); return true; }
  catch(e){ toast('保存失败：浏览器存储已满'); return false; }
}

function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), ms||2000);
}

/* ===================== 表单逻辑 ===================== */
function setStatus(type, text){
  const el = $('#status');
  el.className = 'status ' + type;
  $('#statusText').textContent = text;
}

function applyProvider(p, keepValues){
  const conf = PROVIDERS[p] || PROVIDERS.free;
  $('#providerTip').textContent = conf.tip;
  if(!keepValues){
    $('#base').value = conf.base;
    $('#model').value = conf.model;
  }
}

$('#provider').onchange = () => {
  applyProvider($('#provider').value, false);
};

/* 密码显隐 */
$('#eye').onclick = () => {
  const inp = $('#key');
  const isPw = inp.type === 'password';
  inp.type = isPw ? 'text' : 'password';
  $('#eye').textContent = isPw ? '隐藏' : '显示';
};

/* 载入已保存的配置 */
function loadForm(){
  const c = getCfg();
  if(!c || !c.key){
    // 兼容旧版本 key（rep_cfg_kKey）
    let legacy = '';
    try{ legacy = localStorage.getItem('rep_cfg_kKey') || ''; }catch(e){}
    if(legacy){
      $('#key').value = legacy.trim();
      $('#provider').value = 'free';
      applyProvider('free', false);
      setStatus('no', '检测到旧版 Key，请点「保存」完成迁移');
    }else{
      $('#provider').value = 'free';
      applyProvider('free', false);
      setStatus('no', '未配置');
    }
    renderSaved({});
    return;
  }
  $('#provider').value = c.provider || 'free';
  if(/PaddleOCR-VL/i.test(c.model)){
    c.model = 'deepseek-ai/DeepSeek-OCR';        // PaddleOCR-VL 已下架，自动换免费的 DeepSeek-OCR
    setCfg(Object.assign({}, c, {model: c.model}));
  }
  if(c.model === 'Qwen/Qwen2.5-VL-32B-Instruct'){
    c.model = 'Qwen/Qwen3-VL-32B-Instruct';   // 旧模型已下架，自动升级
    setCfg(Object.assign({}, c, {model: c.model}));
  }
  $('#base').value = c.base || PROVIDERS[c.provider]?.base || '';
  $('#model').value = c.model || PROVIDERS[c.provider]?.model || '';
  $('#key').value = c.key || '';
  applyProvider(c.provider || 'free', true);
  setStatus('ok', '已配置 · ' + (PROVIDERS[c.provider]?.name || '自定义') + ' · 尾号 ' + String(c.key).slice(-4));
  renderSaved(c);
}

function renderSaved(c){
  const box = $('#saved');
  if(!c.key){
    box.innerHTML = '<span style="color:#c0392b">配置为空，拍照识别不可用</span>';
    return;
  }
  const mask = v => {
    v = String(v||'');
    if(v.length <= 8) return v;
    return v.slice(0,4) + '****' + v.slice(-4);
  };
  box.innerHTML =
    '<div>服务商：<b>' + (PROVIDERS[c.provider]?.name || '自定义') + '</b></div>' +
    '<div>模型：<span style="font-family:monospace;font-size:12px">' + (c.model || '-') + '</span></div>' +
    '<div>Key：<span style="font-family:monospace;font-size:12px">' + mask(c.key) + '</span></div>' +
    '<div>保存时间：' + (c.savedAt ? new Date(c.savedAt).toLocaleString('zh-CN') : '—') + '</div>';
}

/* 保存 */
$('#btnSave').onclick = () => {
  const provider = $('#provider').value;
  const base = $('#base').value.trim();
  const model = $('#model').value.trim();
  const key = $('#key').value.trim();

  // 校验
  ['#base','#model','#key'].forEach(s => $(s).classList.remove('err'));
  if(!base){ $('#base').classList.add('err'); toast('请填写接口地址'); return; }
  if(!/^https?:\/\//i.test(base)){ $('#base').classList.add('err'); toast('接口地址需以 http:// 或 https:// 开头'); return; }
  if(!model){ $('#model').classList.add('err'); toast('请填写模型名称'); return; }
  if(!key){ $('#key').classList.add('err'); toast('请粘贴 API Key'); return; }
  if(/\s/.test(key)){ $('#key').classList.add('err'); toast('Key 中不能有空格，请重新复制'); return; }

  const old = getCfg();
  const cfg = Object.assign({}, old, {
    provider, base, model, key,
    savedAt: new Date().toISOString()
  });
  if(setCfg(cfg)){
    setStatus('ok', '已保存 · ' + (PROVIDERS[provider]?.name || '自定义') + ' · 尾号 ' + key.slice(-4));
    renderSaved(cfg);
    toast('✓ 已保存\n日志页可直接使用');
  }
};

/* 测试连通（带诊断：区分「网络不通」与「跨域被拦截」） */
$('#btnTest').onclick = async () => {
  const base = $('#base').value.trim();
  const model = $('#model').value.trim();
  const key = $('#key').value.trim();
  if(!base || !model || !key){ toast('请先填写接口地址、模型名称和 Key'); return; }

  const btn = $('#btnTest');
  btn.disabled = true; btn.textContent = '测试中…';
  setStatus('no', '正在连接接口…');
  const t0 = Date.now();
  const timeout = (ms)=>{ const c=new AbortController(); setTimeout(()=>c.abort(), ms); return c.signal; };
  let res=null;
  const directErrs=[];

  try{
    /* ---- 通道1：直连 ---- */
    try{
      res = await fetch(base, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
        body: JSON.stringify({ model, messages:[{ role:'user', content:'hi' }], max_tokens: 8 }),
        signal: timeout(20000)
      });
    }catch(e1){
      res = null;
      const why = e1.name==='AbortError' ? '20秒无响应(超时)' : (e1.message||'连接失败');
      directErrs.push('直连失败：'+why);
      /* 网络可达性探测（no-cors 只测能不能连上服务器，不受跨域限制） */
      let netOk=false;
      try{ await fetch(base, {mode:'no-cors', signal: timeout(10000)}); netOk=true; }catch(e2){}
      if(netOk){
        directErrs.push('诊断：网络可达，但浏览器拦截了跨域请求');
      }else{
        directErrs.push('诊断：手机网络连不上该接口域名');
      }
      /* ---- 通道2：中转（仅在直连失败时尝试） ---- */
      try{
        res = await fetch('https://corsproxy.io/?url='+encodeURIComponent(base), {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
          body: JSON.stringify({ model, messages:[{ role:'user', content:'hi' }], max_tokens: 8 }),
          signal: timeout(20000)
        });
      }catch(e2){
        res = null;
        directErrs.push('中转失败：'+(e2.name==='AbortError'?'超时':(e2.message||'连接失败')));
      }
    }

    if(!res){
      /* 直连与中转都失败：按诊断结果给出精确指引 */
      let guide;
      if(directErrs.some(s=>s.includes('跨域拦截'))){
        guide='网络是通的，但当前浏览器拦截了跨域请求。\n最常见原因：在微信里直接打开。\n解决：点右上角「…」→「在浏览器中打开」，或复制网址用手机浏览器（Chrome/Safari）打开后再测。';
      }else if(directErrs.some(s=>s.includes('连不上'))){
        guide='手机当前网络无法访问该接口域名。\n请检查：①手机能否上网 ②接口地址是否拼写正确 ③是否开了VPN/代理（关掉再试）';
      }else{
        guide='直连与中转都失败，且未能定位原因。\n建议换一个网络（如换Wi-Fi/流量）再试。';
      }
      setStatus('err', '✗ 连接失败');
      toast('✗ 连接失败\n'+directErrs.join('\n')+'\n\n'+guide, 9000);
    }else{
      const txt = await res.text();
      const ms = Date.now() - t0;
      if(res.ok){
        setStatus('ok', '✓ 连接成功（' + ms + 'ms）· Key 可用');
        toast('✓ Key 可用，可以识别了', 2200);
      }else{
        let hint = '';
        if(res.status === 401) hint = 'Key 不正确或已失效';
        else if(res.status === 402) hint = '账户余额不足，请到平台充值（cloud.siliconflow.cn → 费用中心）';
        else if(res.status === 403) hint = '无权限访问该模型，检查模型名';
        else if(res.status === 404) hint = '接口地址不对';
        else if(res.status === 429) hint = '调用过于频繁，稍后再试';
        else if(res.status >= 500) hint = '服务端异常，稍后再试';
        setStatus('err', '✗ 失败 ' + res.status + (hint ? '：' + hint : ''));
        toast('✗ 失败 ' + res.status + (hint ? '\n' + hint : '') + '\n' + txt.slice(0,100), 4500);
      }
    }
  }catch(e){
    setStatus('err', '✗ 测试异常');
    toast('✗ 测试异常：' + e.message, 4000);
  }
  btn.disabled = false; btn.textContent = '测试连通';
};

/* 清除配置 */
$('#btnClear').onclick = () => {
  if(!confirm('确定清除已保存的 API Key？\n清除后拍照识别将不可用。')) return;
  if(LS_OK){
    try{ localStorage.removeItem(CFG_KEY); localStorage.removeItem('rep_cfg_kKey'); }catch(e){}
  }
  memFallback = {};
  $('#key').value = '';
  setStatus('no', '未配置');
  renderSaved({});
  toast('已清除配置');
};

/* ===================== 人员配置 ===================== */
const DEFAULT_CREW = ['亷丽霞','许来霞','刘晓燕','张春燕','刘淑会','岳静','许娜娜'];

function currentCrew(){
  const c = getCfg();
  return Array.isArray(c.crew) ? c.crew.slice() : DEFAULT_CREW.slice();
}
function saveCrew(list){
  const cfg = Object.assign({}, getCfg(), { crew: list.slice() });
  setCfg(cfg);
}
function renderCrew(){
  const list = currentCrew();
  const box = $('#crewChips');
  box.innerHTML = '';
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'crew-empty';
    empty.style.cssText = 'width:100%;';
    empty.textContent = '暂无人员，点下方 ＋ 添加';
    box.appendChild(empty);
  }
  list.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.appendChild(document.createTextNode(name));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'x';
    x.textContent = '×';
    x.setAttribute('aria-label','删除'+name);
    x.onclick = () => {
      const l = currentCrew();
      const idx = l.indexOf(name);
      if(idx >= 0) l.splice(idx, 1);
      saveCrew(l);
      renderCrew();
      toast('已删除「' + name + '」');
    };
    chip.appendChild(x);
    box.appendChild(chip);
  });
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'chip-add';
  add.textContent = '＋';
  add.onclick = () => startAdd(add);
  box.appendChild(add);
  $('#crewCount').textContent = list.length;
}
function startAdd(btn){
  const inp = document.createElement('input');
  inp.className = 'chip-input';
  inp.placeholder = '输入姓名';
  inp.autocomplete = 'off';
  btn.replaceWith(inp);
  inp.focus();
  let done = false;
  const commit = () => {
    if(done) return;
    done = true;
    const name = inp.value.trim();
    if(name){
      const l = currentCrew();
      if(l.indexOf(name) >= 0){
        toast('「' + name + '」已存在');
      }else{
        l.push(name);
        saveCrew(l);
        toast('已添加「' + name + '」');
      }
    }
    renderCrew();
  };
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ done = true; renderCrew(); }
  });
  inp.addEventListener('blur', () => setTimeout(commit, 50));
}

/* ===================== 炉号配置 ===================== */
const DEFAULT_FURNACES = [1,2,3,4,5,7,8,10,11,12];

function currentFurnaces(){
  const c = getCfg();
  return Array.isArray(c.furnaces) ? c.furnaces.slice() : DEFAULT_FURNACES.slice();
}
function saveFurnaces(list){
  const arr = list.slice().sort((a,b)=>a-b);
  const cfg = Object.assign({}, getCfg(), { furnaces: arr });
  setCfg(cfg);
}
function renderFurnaces(){
  const list = currentFurnaces().sort((a,b)=>a-b);
  const box = $('#furnaceChips');
  box.innerHTML = '';
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'crew-empty';
    empty.style.cssText = 'width:100%;';
    empty.textContent = '暂无炉号，点下方 ＋ 添加';
    box.appendChild(empty);
  }
  list.forEach(no => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.appendChild(document.createTextNode(no + '#'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'x';
    x.textContent = '×';
    x.setAttribute('aria-label','删除'+no+'号炉');
    x.onclick = () => {
      const l = currentFurnaces();
      const idx = l.indexOf(no);
      if(idx >= 0) l.splice(idx, 1);
      saveFurnaces(l);
      renderFurnaces();
      toast('已删除 ' + no + '# 炉');
    };
    chip.appendChild(x);
    box.appendChild(chip);
  });
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'chip-add';
  add.textContent = '＋';
  add.onclick = () => startAddFurnace(add);
  box.appendChild(add);
  $('#furnaceCount').textContent = list.length;
}
function startAddFurnace(btn){
  const inp = document.createElement('input');
  inp.className = 'chip-input';
  inp.placeholder = '炉号';
  inp.inputMode = 'numeric';
  inp.autocomplete = 'off';
  btn.replaceWith(inp);
  inp.focus();
  let done = false;
  const commit = () => {
    if(done) return;
    done = true;
    const v = inp.value.trim();
    if(v){
      if(!/^\d+$/.test(v)){ toast('炉号需为纯数字，如 6 或 13'); renderFurnaces(); return; }
      const n = parseInt(v, 10);
      if(isNaN(n) || n <= 0){ toast('炉号需为正整数'); renderFurnaces(); return; }
      const l = currentFurnaces();
      if(l.indexOf(n) >= 0){ toast(n + '# 炉已存在'); renderFurnaces(); return; }
      l.push(n);
      saveFurnaces(l);
      toast('已添加 ' + n + '# 炉');
    }
    renderFurnaces();
  };
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ done = true; renderFurnaces(); }
  });
  inp.addEventListener('blur', () => setTimeout(commit, 50));
}

/* 启动 */
applyProvider('free', false);
loadForm();
renderCrew();
renderFurnaces();

  if(/MicroMessenger/i.test(navigator.userAgent)) warn.push('当前在微信内置浏览器中打开，网络请求可能被限制。建议点右上角「…」→「在浏览器中打开」。');
  if(!LS_OK) warn.push('当前浏览器禁止本地存储（无痕模式？），配置将无法保存。');
  if(warn.length){
    const el = document.createElement('div');
    el.style.cssText = 'background:#fff8e6;border:1px solid #f0dfae;color:#8a6100;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.8;margin-bottom:12px;';
    el.innerHTML = '<b style="display:block;margin-bottom:4px;">⚠ 环境提示</b>' + warn.join('<br>');
    const first = document.querySelector('.card');
    first.parentNode.insertBefore(el, first);
  }
})();
